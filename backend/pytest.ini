[pytest]
# `pythonpath = .` lets tests do `from app.main import app` without installing
# the project as a package.
pythonpath = .
testpaths = tests
# Slow tests download and run the embedding model; excluded by default so the
# normal loop stays under three seconds. Run them with: pytest -m slow
addopts = -q -m "not slow"
markers =
    slow: needs the sentence-transformers model (downloads ~90MB on first run)
