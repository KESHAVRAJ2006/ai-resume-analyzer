# Nginx config for the built SPA.
#
# A trap worth knowing: add_header is NOT cumulative across levels. If a
# location block declares even one add_header, every add_header from the server
# block is discarded for that location - silently, with no warning. That is why
# the security headers below are repeated in each location rather than declared
# once at the top: declaring them only at server level means the pages that set
# their own Cache-Control ship with no security headers at all.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints every asset filename, so those can be cached forever.
    location /assets/ {
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or users keep loading an old app that
    # points at asset files which no longer exist.
    location = /index.html {
        add_header Cache-Control          "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    }

    # Single-page app: every unknown path returns index.html so the client
    # renders instead of nginx 404ing on a route it has never heard of.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
